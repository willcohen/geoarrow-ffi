language = "C"
cpp_compat = true
header = "// Auto-generated by cbindgen - DO NOT EDIT\n// geoarrow-rs C API"
include_guard = "GEOARROW_RS_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
# Status codes are errno values, so callers need <errno.h> to name them.
sys_includes = ["errno.h"]
# The Arrow C Data Interface structs are emitted by hand inside the canonical
# ARROW_C_DATA_INTERFACE guard, plus geoarrow-c's outer guard for Arrow
# headers that predate it, so this header can share a translation unit with
# arrow/c/abi.h or nanoarrow.h. Not with geoarrow.h: the vocabulary types
# redefine geoarrow-c's, so those two headers need separate translation units.
after_includes = """
#ifndef ARROW_FLAG_DICTIONARY_ORDERED
#ifndef ARROW_C_DATA_INTERFACE
#define ARROW_C_DATA_INTERFACE

#define ARROW_FLAG_DICTIONARY_ORDERED 1
#define ARROW_FLAG_NULLABLE 2
#define ARROW_FLAG_MAP_KEYS_SORTED 4

struct ArrowSchema {
  const char* format;
  const char* name;
  const char* metadata;
  int64_t flags;
  int64_t n_children;
  struct ArrowSchema** children;
  struct ArrowSchema* dictionary;
  void (*release)(struct ArrowSchema*);
  void* private_data;
};

struct ArrowArray {
  int64_t length;
  int64_t null_count;
  int64_t offset;
  int64_t n_buffers;
  int64_t n_children;
  const void** buffers;
  struct ArrowArray** children;
  struct ArrowArray* dictionary;
  void (*release)(struct ArrowArray*);
  void* private_data;
};

#endif  // ARROW_C_DATA_INTERFACE

// The stream struct rides inside the outer guard, as geoarrow-c emits it: a
// later header that skips its own Arrow block on that guard (nanoarrow.h)
// still needs ArrowArrayStream defined.
#ifndef ARROW_C_STREAM_INTERFACE
#define ARROW_C_STREAM_INTERFACE

struct ArrowArrayStream {
  int (*get_schema)(struct ArrowArrayStream*, struct ArrowSchema* out);
  int (*get_next)(struct ArrowArrayStream*, struct ArrowArray* out);
  const char* (*get_last_error)(struct ArrowArrayStream*);
  void (*release)(struct ArrowArrayStream*);
  void* private_data;
};

#endif  // ARROW_C_STREAM_INTERFACE
#endif  // ARROW_FLAG_DICTIONARY_ORDERED

typedef struct ArrowSchema ArrowSchema;
typedef struct ArrowArray ArrowArray;
"""

[export]
# No prefix rule: functions are named GeoArrowRs* in the source, the
# vocabulary types keep geoarrow-c's spelling, and the Arrow struct names must
# stay canonical.
item_types = ["globals", "enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]
# No signature names these enums; cbindgen must be told to emit them.
include = ["GeoArrowDimensions", "GeoArrowCoordType", "GeoArrowEdgeType", "GeoArrowType"]
# Emitted by hand in after_includes, inside the canonical guard.
exclude = ["ArrowArray", "ArrowSchema"]

[parse]
parse_deps = false
# No [parse.expand]: every entry point is a plain function, visible without
# macro expansion, so regeneration runs on stable.

[fn]
args = "horizontal"
