name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fresh checkout: the parity test compares against current geoarrow-c.
      - name: Check out geoarrow-c
        uses: actions/checkout@v7
        with:
          repository: geoarrow/geoarrow-c
          path: geoarrow-c
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
        env:
          GEOARROW_C_DIR: ${{ github.workspace }}/geoarrow-c

  header:
    name: Header freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: Regenerate the header
        run: cbindgen --output geoarrow_rs.h
      - name: Diff against the committed header
        run: git diff --exit-code geoarrow_rs.h
