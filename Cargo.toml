[package]
name = "geoarrow-ffi"
version = "0.1.0"
edition = "2024"
description = "C API for geoarrow-rs, over the Arrow C Data Interface"
repository = "https://github.com/willcohen/geoarrow-ffi"
license = "MIT OR Apache-2.0"

[lib]
name = "geoarrow_rs"
crate-type = ["cdylib", "staticlib"]

[profile.release]
# Entry points contain panics with catch_unwind; panic=abort would void that
# and turn any contained panic into a process abort across the C boundary.
panic = "unwind"

[dependencies]
arrow-data = { version = "58", features = ["ffi"] }
arrow-schema = { version = "58", features = ["ffi"] }
geoarrow-schema = "0.8"
# Crs::from_projjson takes a serde_json::Value, so CRS text is parsed here.
serde_json = "1"

[dev-dependencies]
arrow-array = { version = "58", features = ["ffi"] }
